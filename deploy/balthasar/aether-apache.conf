# AETHER — gioco di hacking multiplayer (https://github.com/Indr1d-C0ld/Aether).
# Installata da deploy/balthasar/installa.sh in conf-available/ e abilitata con a2enconf.
# Non tocca i vhost: vale per la 443 e per la 80 (che a sua volta rimanda alla 443).
#
# Il server Node ascolta solo su 127.0.0.1:7077 e serve tutto da sé: client
# compilato per /aether/, WebSocket su /ws, stato numerico su /health.
# mod_proxy aggiunge X-Forwarded-For: il server ne legge l'ultima voce per
# limitare i tentativi di login e le registrazioni per indirizzo.
#
# Gli interruttori della landing coprono anche questo percorso (segmento
# «aether»): mod_rewrite nei vhost lavora prima di ProxyPass.

RedirectMatch 301 ^/aether$ /aether/

# il WebSocket prima della regola generale
ProxyPass        /aether/ws  ws://127.0.0.1:7077/ws
ProxyPassReverse /aether/ws  ws://127.0.0.1:7077/ws

ProxyPass        /aether/    http://127.0.0.1:7077/ timeout=60
ProxyPassReverse /aether/    http://127.0.0.1:7077/

<Location "/aether/">
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "same-origin"
        Header always set X-Frame-Options "SAMEORIGIN"
    </IfModule>
</Location>

# L'app Android (una Trusted Web Activity, vedi android/README.md) si apre senza barra dell'indirizzo solo se
# il dominio dichiara di riconoscerla. Un solo file, servito dalla copia installata: il resto di /.well-known/
# (i certificati) non cambia.
Alias /.well-known/assetlinks.json /opt/aether/app/android/assetlinks.json
<Directory "/opt/aether/app/android">
    Require all denied
    <Files "assetlinks.json">
        Require all granted
        ForceType application/json
    </Files>
</Directory>
